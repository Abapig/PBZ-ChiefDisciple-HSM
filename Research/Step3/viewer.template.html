<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大师兄 × 红衣 · 全量分层状态机</title>
<style>
:root{color-scheme:dark;--bg:#10151d;--panel:#18212c;--line:#304151;--text:#e3eaf2;--muted:#96a9bf;--gold:#e7c58d;--accent:#6ecfc0}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,'Microsoft YaHei',sans-serif}button,input{font:inherit}button{color:#dfe7ef;background:#253344;border:1px solid #42576d;border-radius:6px;padding:7px 12px;cursor:pointer}button:hover{background:#344a60}button.active{border-color:var(--gold);color:var(--gold)}header{height:68px;display:flex;align-items:center;gap:18px;padding:10px 18px;background:#18212c;border-bottom:1px solid var(--line)}header strong{display:block;color:var(--gold);font-size:18px;letter-spacing:.03em}header small{color:var(--muted);font-size:12px}.spacer{flex:1}.toolbar{display:flex;align-items:center;gap:7px}.shell{height:calc(100% - 68px);display:grid;grid-template-columns:238px minmax(300px,1fr) 350px}.shell.no-detail{grid-template-columns:238px minmax(300px,1fr)}.shell.no-detail aside.detail{display:none}aside{background:#17212c;overflow:auto;padding:16px 13px;border-right:1px solid var(--line)}aside.detail{border-right:0;border-left:1px solid var(--line);padding:20px 18px}h2{font-size:17px;margin:0 0 12px;color:var(--gold)}h3{font-size:13px;margin:22px 0 9px;color:#9fb7cc;text-transform:uppercase;letter-spacing:.04em}.meta{font-size:12px;color:var(--muted);margin:8px 0 16px}.nav-item{display:block;width:100%;padding:10px 8px;text-align:left;margin-bottom:5px;font-size:12px;background:transparent;border:1px solid transparent;border-left:3px solid #37576d;border-radius:3px}.nav-item:hover,.nav-item.active{background:#243547;border-left-color:var(--gold)}input[type=search]{width:100%;padding:9px;background:#0e1822;color:var(--text);border:1px solid #40566c;border-radius:6px;outline:none}.result{display:block;width:100%;text-align:left;margin:5px 0;padding:7px;font-size:12px}#results{max-height:260px;overflow:auto}.canvas{position:relative;overflow:hidden;background:#10151d;touch-action:none}#viewport{width:100%;height:100%;cursor:grab}#viewport.dragging{cursor:grabbing}#fsm{display:block;width:100%;height:100%;user-select:none}#fsm text{user-select:none}.hint{position:absolute;left:16px;bottom:13px;background:#14202ddd;border:1px solid #34485a;padding:7px 11px;border-radius:7px;font-size:12px;color:#a9bcd0;pointer-events:none}.minimap{position:absolute;right:14px;bottom:14px;border:1px solid #4c657b;background:#111c29e6;border-radius:6px;width:168px;height:200px;cursor:crosshair}.legend{position:absolute;left:14px;top:12px;display:flex;gap:11px;background:#14202ddd;border:1px solid #34485a;border-radius:7px;padding:8px 11px;font-size:11px;pointer-events:none}.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}.row{margin:7px 0;font-size:13px;color:#c1cfdd}.code{font-family:ui-monospace,Consolas,monospace;color:#9dd6ce;overflow-wrap:anywhere;font-size:12px}.guard{border-left:2px solid #617c97;padding:9px 10px;margin:8px 0;background:#1c2a39;font-size:12px;overflow-wrap:anywhere}.guard button{font-size:11px;padding:2px 6px;margin-top:6px}.badge{display:inline-block;padding:2px 6px;border:1px solid #4b6074;border-radius:4px;color:#acc6db;font-size:11px;margin:0 5px 4px 0}.formula{padding:11px;background:#101b27;border:1px solid #2c465d;border-radius:6px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.resource{font-size:11px;border-bottom:1px solid #2a3c4e;padding:7px 0;overflow-wrap:anywhere}.null{color:#cfab7a}label.option{font-size:12px;display:block;margin:8px 0;color:#a6bbcd}a{color:#9ecde8}#toast{position:absolute;top:55px;left:50%;transform:translateX(-50%);background:#203e42;border:1px solid #59a69d;border-radius:8px;padding:10px 18px;z-index:10;display:none}#zoomLabel{font-size:12px;color:#c5d0df;min-width:44px;text-align:center}.count{display:flex;gap:6px;flex-wrap:wrap}details{margin:8px 0}summary{cursor:pointer;color:#b6ccdd;font-size:13px}body.presentation header,body.presentation .nav,body.presentation .detail{display:none}body.presentation .shell{height:100%;display:block}body.presentation .canvas{height:100%}body.presentation .hint{display:none}@media(max-width:1100px){.shell{grid-template-columns:200px minmax(200px,1fr)}aside.detail{position:absolute;right:0;top:68px;bottom:0;width:330px;z-index:4;box-shadow:-8px 0 25px #0008}.toolbar .wide{display:none}.legend{font-size:10px;gap:6px}.shell.no-detail{grid-template-columns:200px minmax(200px,1fr)}}
</style></head><body>
<header><div><strong>大师兄 × 红衣女剑客 · 分层状态机</strong><small>第三步设计 · 同一画布全展开 · 状态框出口直接连线</small></div><div class="spacer"></div><div class="toolbar"><button id="fitAll">全图</button><button id="zoomOut">−</button><span id="zoomLabel"></span><button id="zoomIn">＋</button><button id="clear" class="wide">清除高亮</button><button id="detailsButton">详情</button><button id="exportSvg" class="wide">导出全图 SVG</button><button id="shot" class="wide">截图模式</button></div></header>
<div class="shell" id="shell"><aside class="nav"><h2>画布导航</h2><div class="meta" id="counts"></div><input type="search" id="search" placeholder="搜状态 / 招式编号 / 条件…"><div id="results"></div><h3>连线显示</h3><label class="option"><input type="checkbox" id="showData" checked> 数据与事件连线</label><label class="option"><input type="checkbox" id="showGlobals" checked> 继承全局抢占连线</label><label class="option"><input type="checkbox" id="neighbors">选中时只突出相邻状态</label><h3>同页分区 · 点击平移定位</h3><div id="navigation"></div><p class="meta">滚轮缩放 · 空白拖拽平移<br>单击状态查看全部出入条件<br>双击状态放大定位<br>Esc清高亮 / 退出截图模式</p><p class="meta"><a href="全部状态与条件索引.md">完整条件索引</a><br><a href="parameter_interfaces.json">参数接口</a><br><a href="asset_bindings.json">资源命名与空绑定</a></p></aside>
<section class="canvas" id="canvas"><div id="viewport">__SVG__</div><div class="legend"><span><i style="background:#e9bd75"></i>阶段</span><span><i style="background:#94c789"></i>防御/受击</span><span><i style="background:#65bfff"></i>蓝光</span><span><i style="background:#f18b83"></i>红光</span><span><i style="background:#c8a0ed"></i>黑光</span><span><i style="background:#69c8b6"></i>并行数据</span></div><canvas class="minimap" id="minimap" width="336" height="400"></canvas><div class="hint">全部分区都在这张画布上 · 左侧导航只移动视口 · 动画 / 角色 / 碰撞引用均留空</div><div id="toast"></div></section>
<aside class="detail" id="detail"></aside></div>
<script id="graph-data" type="application/json">__DATA__</script>
<script>
'use strict';
const graph=JSON.parse(document.getElementById('graph-data').textContent),nodes=new Map(graph.nodes.map(n=>[n.id,n])),edges=new Map(graph.edges.map(e=>[e.id,e]));
const svg=document.getElementById('fsm'),viewport=document.getElementById('viewport'),detail=document.getElementById('detail'),canvas=document.getElementById('canvas'),mini=document.getElementById('minimap');
let view={x:0,y:0,w:2000,h:1400},selected=null,drag=null,moved=false;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const sizes=()=>({w:viewport.clientWidth,h:viewport.clientHeight});
function setView(x,y,w,h){view={x,y,w,h};svg.setAttribute('viewBox',`${x} ${y} ${w} ${h}`);document.getElementById('zoomLabel').textContent=Math.round(sizes().w/w*100)+'%';drawMap()}
function fit(box,pad=60){const s=sizes(),ratio=s.w/s.h;let w=box.width+2*pad,h=box.height+2*pad;if(w/h<ratio)w=h*ratio;else h=w/ratio;setView(box.x+box.width/2-w/2,box.y+box.height/2-h/2,w,h)}
function focusGroup(id){const g=graph.groups.find(g=>g.id===id);fit(g,40);document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.group===id));}
function zoom(factor,cx=.5,cy=.5){let nw=Math.max(700,Math.min(graph.width*3,view.w*factor));let nh=nw*sizes().h/sizes().w;setView(view.x+(view.w-nw)*cx,view.y+(view.h-nh)*cy,nw,nh)}
function drawMap(){const ctx=mini.getContext('2d'),w=mini.width,h=mini.height;ctx.clearRect(0,0,w,h);const scale=Math.min((w-16)/graph.width,(h-16)/graph.height);const ox=(w-graph.width*scale)/2,oy=(h-graph.height*scale)/2;mini.map={scale,ox,oy};graph.groups.forEach(g=>{ctx.fillStyle='#253b50';ctx.strokeStyle='#58718a';ctx.fillRect(ox+g.x*scale,oy+g.y*scale,g.width*scale,g.height*scale);ctx.strokeRect(ox+g.x*scale,oy+g.y*scale,g.width*scale,g.height*scale)});ctx.strokeStyle='#edce96';ctx.lineWidth=2;ctx.strokeRect(ox+view.x*scale,oy+view.y*scale,view.w*scale,view.h*scale)}
function lineVisibility(){const data=document.getElementById('showData').checked,global=document.getElementById('showGlobals').checked;document.querySelectorAll('.wire').forEach(p=>{const e=edges.get(p.id);p.classList.toggle('hide-wire',e.kind==='global'?!global:(e.kind==='data'||e.kind==='event')&&!data)});if(selected)highlight(selected)}
function highlight(id){selected=id;const ns=new Set([id]),es=new Set();graph.edges.forEach(e=>{if(e.source===id||e.target===id){ns.add(e.source);ns.add(e.target);es.add(e.id)}});const only=document.getElementById('neighbors').checked;document.querySelectorAll('.state').forEach(n=>{n.classList.toggle('selected',n.id===id);n.classList.toggle('dim',only&&!ns.has(n.id))});document.querySelectorAll('.wire').forEach(p=>{p.classList.toggle('highlight',es.has(p.id));p.classList.toggle('dim',only&&!es.has(p.id))})}
function reset(){selected=null;document.querySelectorAll('.selected,.highlight,.dim').forEach(n=>n.classList.remove('selected','highlight','dim'));intro()}
function guardCard(e,incoming=false){const card=el('div',undefined,'guard');card.append(el('div',`${e.id} · ${e.kind} · 优先级 ${e.priority}`,'code'));card.append(el('div',e.guard));if(e.actions)card.append(el('div','执行：'+e.actions,'meta'));const target=incoming?e.source:e.target;const b=el('button',(incoming?'← ':'→ ')+nodes.get(target).title);b.onclick=()=>select(target,true);card.append(b);return card}
function select(id,focus=false){const n=nodes.get(id);highlight(id);if(focus){const near=[n,...graph.edges.filter(e=>e.kind==='flow'&&(e.source===id||e.target===id)).map(e=>nodes.get(e.source===id?e.target:e.source)).filter(o=>o.group===n.group)];const x=Math.min(...near.map(o=>o.x)),y=Math.min(...near.map(o=>o.y));fit({x,y,width:Math.max(...near.map(o=>o.x+o.width))-x,height:Math.max(...near.map(o=>o.y+o.height))-y},100);}detail.replaceChildren();detail.append(el('div',n.id,'code'),el('h2',n.title),el('span',graph.groups.find(g=>g.id===n.group).title,'badge'),el('p',n.detail,'row'),el('div',n.hierarchy,'code'));if(n.move)detail.append(el('div','规范招式ID：'+n.move,'code'));if(n.rules.length)detail.append(el('p','继承：'+n.rules.join(' / ')+'（优先级高于本地出口）','meta'));
const outs=n.outgoing.map(id=>edges.get(id));detail.append(el('h3','所有出口 / 完整守卫条件'));outs.forEach(e=>detail.append(guardCard(e)));
if(n.incoming.length){const d=el('details');d.append(el('summary',`进入连线 (${n.incoming.length})`));n.incoming.forEach(id=>d.append(guardCard(edges.get(id),true)));detail.append(d)}
if(Object.keys(n.params).length){detail.append(el('h3','参数接口 / 当前设计默认'));const p=el('div',JSON.stringify(n.params,null,2),'formula');detail.append(p)}
if(n.assets.length){detail.append(el('h3','资源占位 / 未绑定'));n.assets.forEach(a=>{const r=el('div',undefined,'resource');r.append(el('div',a.name,'code'),el('span',a.type+' = null','null'));detail.append(r)})}
detail.scrollTop=0;}
function intro(){detail.replaceChildren();detail.append(el('h2','单页全量设计图'),el('p','参考你提供的 PlayMaker / FSM 截图，状态框内列出出口，出口直接连接目标。所有层级和招式均已展开。','row'));const stats=el('div',undefined,'count');[graph.audit.nodes+' 个节点',graph.audit.edges+' 条连线','33 个根招式',graph.audit.groups+' 个分区'].forEach(t=>stats.append(el('span',t,'badge')));detail.append(stats,el('h3','建议查看顺序'));['01 战斗阶段与死亡分支','05 中央权重与预约','09–13 七星剑阵 / 脱阵 / 吸血','14–16 大师兄出招池与变招','17–18 红衣 / 联合技 / 狂暴','03–04 实时压力与跨场学习'].forEach(t=>detail.append(el('p',t,'row')));detail.append(el('h3','读图约定'),el('p','白灰实线是状态转换；青色虚线是并行数据依赖；金色虚线是事件路由；淡红线为动作继承的全局抢占。并行数据节点不会占用角色动作状态。','row'),el('h3','资源留空但逻辑不悬停'),el('p','每个动作有命名动画接口，引用为 null。计时与事件身份独立于素材，缺动画时使用逻辑时长推进。命中结果仍需要真实事件或明确的测试输入。','row'),el('p','本图为第三步设计交付，不是已创建的 UE 蓝图资产。','meta'));}
document.getElementById('counts').textContent=`${graph.audit.nodes} 状态/逻辑节点 · ${graph.audit.edges} 转换/依赖线`;
const nav=document.getElementById('navigation');graph.groups.forEach(g=>{const b=el('button',g.title,'nav-item');b.dataset.group=g.id;b.onclick=()=>focusGroup(g.id);nav.append(b)});
viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect();zoom(e.deltaY>0?1.12:1/1.12,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
viewport.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,v:{...view}};moved=false;viewport.classList.add('dragging');viewport.setPointerCapture(e.pointerId)});
viewport.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;if(moved)setView(drag.v.x-dx*drag.v.w/sizes().w,drag.v.y-dy*drag.v.h/sizes().h,drag.v.w,drag.v.h)});
viewport.addEventListener('pointerup',e=>{viewport.classList.remove('dragging');drag=null;if(viewport.hasPointerCapture(e.pointerId))viewport.releasePointerCapture(e.pointerId);if(!moved){const t=document.elementFromPoint(e.clientX,e.clientY),p=t&&t.closest('.port'),n=t&&t.closest('.state');if(p){const edge=edges.get(p.dataset.edge);select(edge.source);document.getElementById(edge.id).classList.add('highlight')}else if(n)select(n.id)}});
viewport.addEventListener('dblclick',e=>{const n=e.target.closest('.state');if(n)select(n.id,true)});
mini.onclick=e=>{const r=mini.getBoundingClientRect(),m=mini.map;const x=((e.clientX-r.left)*2-m.ox)/m.scale,y=((e.clientY-r.top)*2-m.oy)/m.scale;setView(x-view.w/2,y-view.h/2,view.w,view.h)};
document.getElementById('fitAll').onclick=()=>fit({x:0,y:0,width:graph.width,height:graph.height},20);
document.getElementById('zoomIn').onclick=()=>zoom(.8);document.getElementById('zoomOut').onclick=()=>zoom(1.25);document.getElementById('clear').onclick=reset;
['showData','showGlobals','neighbors'].forEach(id=>document.getElementById(id).onchange=lineVisibility);
document.getElementById('detailsButton').onclick=()=>{document.getElementById('shell').classList.toggle('no-detail');setView(view.x,view.y,view.w,view.w*sizes().h/sizes().w)};
document.getElementById('search').oninput=e=>{const q=e.target.value.trim().toLowerCase(),results=document.getElementById('results');results.replaceChildren();if(!q)return;graph.nodes.filter(n=>[n.id,n.title,n.body,n.detail,...n.outgoing.map(id=>edges.get(id).guard)].join(' ').toLowerCase().includes(q)).slice(0,30).forEach(n=>{const b=el('button',n.id+' · '+n.title,'result');b.onclick=()=>select(n.id,true);results.append(b)})};
function presentation(){document.body.classList.toggle('presentation');requestAnimationFrame(()=>{setView(view.x,view.y,view.w,view.w*sizes().h/sizes().w)});}
document.getElementById('shot').onclick=presentation;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.body.classList.contains('presentation'))presentation();else reset()}if(e.key==='f'&&e.target.tagName!=='INPUT')document.getElementById('fitAll').click()});
document.getElementById('exportSvg').onclick=()=>{const copy=svg.cloneNode(true);copy.setAttribute('viewBox',`0 0 ${graph.width} ${graph.height}`);copy.setAttribute('width',graph.width);copy.setAttribute('height',graph.height);copy.querySelectorAll('.dim,.selected,.highlight,.hide-wire').forEach(n=>n.classList.remove('dim','selected','highlight','hide-wire'));const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml;charset=utf-8'}));const a=el('a');a.href=url;a.download='Boss全量分层状态机.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
window.addEventListener('resize',()=>setView(view.x,view.y,view.w,view.w*sizes().h/sizes().w));
window.FSM={graph,focusGroup,select,fit,reset,presentation,getView:()=>({...view})};intro();requestAnimationFrame(()=>focusGroup('phase'));
</script></body></html>
